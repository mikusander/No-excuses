name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS Project (Production)
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Xcode version: $(xcodebuild -version)"
          npx cap doctor ios || true
          npx cap sync ios

      - name: Build Production IPA (NoExcuses.ipa)
        run: |
          mkdir -p build
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi
          echo "Using target: $TARGET_ARG"

          xcodebuild \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App-Prod.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="com.noexcuses.workout" \
            PRODUCT_NAME="No Excuses" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p build/Payload-Prod
          cp -R build/App-Prod.xcarchive/Products/Applications/*.app build/Payload-Prod/
          cd build
          mv Payload-Prod Payload
          zip -r NoExcuses.ipa Payload
          rm -rf Payload
          ls -lh NoExcuses.ipa

      - name: Build Dev Live Reload IPA (NoExcuses-Dev.ipa)
        run: |
          BUILD_DEV=true npx cap sync ios

          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          xcodebuild \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App-Dev.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="com.noexcuses.workout.dev" \
            PRODUCT_NAME="No Excuses Dev" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p build/Payload-Dev
          cp -R build/App-Dev.xcarchive/Products/Applications/*.app build/Payload-Dev/
          cd build
          mv Payload-Dev Payload
          zip -r NoExcuses-Dev.ipa Payload
          rm -rf Payload
          ls -lh NoExcuses-Dev.ipa

      - name: Upload Production IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoExcuses-iOS-IPA
          path: build/NoExcuses.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dev Live Reload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoExcuses-Dev-iOS-IPA
          path: build/NoExcuses-Dev.ipa
          if-no-files-found: error
          retention-days: 14
